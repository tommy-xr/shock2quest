name: Build & Unit Test

on:
  push:
    branches: [ "**" ]
    paths-ignore:
      - '**/*.md'
      - 'tools/shock2-sdk/**'
      - '.github/workflows/sdk-tests.yml'
  # Not needed with wildcard branches
  # pull_request:
  #   branches: ["main"]
  #   paths-ignore:
  #     - '**/*.md'

env:
  CARGO_TERM_COLOR: always

jobs:
  unused-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - name: Install dependency checker
        run: cargo install cargo-machete --version 0.9.2 --locked
      - name: Check unused dependencies
        run: cargo machete

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macOS-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v3

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Test build provenance and incremental rebuilds
        run: python3 -m unittest discover -s build-support -p 'test_*.py'

      # Install Linux-specific dependencies
      - name: Install ALSA (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libwayland-dev libxkbcommon-dev ffmpeg libavcodec-dev libavformat-dev libavutil-dev libavdevice-dev libavfilter-dev libswresample-dev libswscale-dev pkg-config yasm

      # Install macOS-specific dependencies
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          # Install FFmpeg 6 which is compatible with ffmpeg-the-third 2.0.1
          brew install ffmpeg@6 pkg-config
          # Set up environment for FFmpeg@6
          echo "PKG_CONFIG_PATH=$(brew --prefix)/lib/pkgconfig:$(brew --prefix ffmpeg@6)/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV
          echo "FFMPEG_DIR=$(brew --prefix ffmpeg@6)" >> $GITHUB_ENV
          echo "CPPFLAGS=-I$(brew --prefix ffmpeg@6)/include" >> $GITHUB_ENV
          echo "LDFLAGS=-L$(brew --prefix ffmpeg@6)/lib" >> $GITHUB_ENV

      # Windows builds with FFmpeg disabled - no additional dependencies needed
      - name: Windows setup
        if: runner.os == 'Windows'
        run: echo "Windows build will use default-features = false to skip FFmpeg"

      # Caches ~/.cargo/registry, ~/.cargo/git, and target/ with smart
      # partial-hit keys (restore-keys), so a Cargo.lock change no longer
      # forces a fully cold build. Replaces the previous target-only cache.
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      # Includes tools omitted by the runtime build/test list below. Android
      # has its own build; this host check uses the default FFmpeg features.
      - name: Check unused code (Unix)
        if: runner.os != 'Windows'
        run: cargo check-unused

      # Actual build steps.
      # Build and test both run in --release so the optimized dependency tree
      # is compiled once and reused by the test step, instead of compiling the
      # whole graph a second time in the dev profile.
      #
      # Everything is built (and tested) in a single cargo invocation per OS so
      # features resolve once and the large shared workspace crates (shock2vr,
      # engine) compile a single time, rather than being partially recompiled
      # when each package is built in its own step.
      # Note: dark_viewer is excluded on Windows due to compilation issues.
      # TODO: Fix dark_viewer Windows compatibility and include it everywhere.
      - name: Build all (Unix)
        if: runner.os != 'Windows'
        run: cargo build --verbose --release -p engine -p desktop_runtime -p dark_viewer -p dark_query -p debug_runtime -p debug_command
        env:
          RUSTFLAGS: "-D warnings"
      - name: Run all tests (Unix)
        if: runner.os != 'Windows'
        run: cargo test --verbose --release -p shock2vr -p engine -p desktop_runtime -p dark_viewer -p dark_query -p debug_runtime -p debug_command
        env:
          RUSTFLAGS: "-D warnings"

      - name: Build all (Windows)
        if: runner.os == 'Windows'
        run: cargo build --verbose --release -p engine -p desktop_runtime -p dark_query -p debug_runtime -p debug_command
        env:
          RUSTFLAGS: "-D warnings"
      - name: Run all tests (Windows)
        if: runner.os == 'Windows'
        run: cargo test --verbose --release --no-default-features -p shock2vr -p engine -p desktop_runtime -p dark_query -p debug_runtime -p debug_command
        env:
          RUSTFLAGS: "-D warnings"

      # Lets local e2e runs and captures use this commit's runtime instead of a
      # per-checkout build. Tarred because artifact zips drop the executable bit.
      - name: Package runtime binaries
        shell: bash
        run: |
          exe=""
          if [ "$RUNNER_OS" = Windows ]; then exe=.exe; fi
          tar -czf "$RUNNER_TEMP/runtime.tar.gz" -C target/release "debug_runtime$exe" "dark_query$exe"
      - uses: actions/upload-artifact@v4
        with:
          name: shock2quest-runtime-${{ runner.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/runtime.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
