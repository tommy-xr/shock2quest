name: Build & Unit Test

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '**/*.md'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        os: [macOS-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v3

      # Install Linux-specific dependencies
      - name: Install ALSA (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev ffmpeg yasm

      # Install macOS-specific dependencies
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg pkg-config
          echo "PKG_CONFIG_PATH=$(brew --prefix)/lib/pkgconfig:$(brew --prefix ffmpeg)/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      # Actual build steps
      - name: Build Desktop Runtime
        run: cargo build --verbose --release
        working-directory: runtimes/desktop_runtime
      - name: Run Desktop Runtime tests
        run: cargo test --verbose
        working-directory: runtimes/desktop_runtime

      # Build and test Shodan CLI tool
      - name: Build Shodan CLI
        run: cargo build --verbose --release -p shodan
      - name: Run Shodan CLI tests
        run: cargo test --verbose -p shodan
