name: Build Android

on:
  push:
    branches: ["**"]
    paths-ignore:
      - '**/*.md'
      - 'tools/shock2-sdk/**'
      - '.github/workflows/sdk-tests.yml'
  # Builds an APK for a head commit that paths-ignore skipped.
  workflow_dispatch:
  # Not needed with wildcard branches
  # pull_request:
  #   branches: ["main"]
  #   paths-ignore:
  #     - '**/*.md'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test release version stamping
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      # Cache cargo build artifacts
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}

      - uses: ./.github/actions/setup-android

      # Dev profile, signed with the release key when the secrets exist (absent
      # on forks: cargo-apk falls back to its debug key).
      - name: Build Android APK
        working-directory: runtimes/oculus_runtime
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            umask 077
            export CARGO_APK_DEV_KEYSTORE="$RUNNER_TEMP/release.keystore"
            export CARGO_APK_DEV_KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD"
            trap 'rm -f "$CARGO_APK_DEV_KEYSTORE"' EXIT
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$CARGO_APK_DEV_KEYSTORE"
          fi
          cargo apk build
          "$ANDROID_HOME/build-tools/33.0.0/apksigner" verify --print-certs ../../target/debug/apk/shock2quest.apk

      # `quest-device.mjs pr` finds this by head SHA.
      - uses: actions/upload-artifact@v4
        with:
          name: shock2quest-apk-${{ github.sha }}
          path: target/debug/apk/shock2quest.apk
          if-no-files-found: error
          retention-days: 30
