
# Optimized, so playtesting, tools, `cargo test` and `cargo check` all share
# one build tree instead of rebuilding dependencies per profile. Our crates
# keep debug assertions and overflow checks; no debug info keeps target/ small
# (panic messages still carry file:line).
[profile.dev]
opt-level = 3
debug = false

# Third-party crates build exactly as in release: no debug assertions or
# overflow checks (they cost rapier real time) and release's codegen units.
[profile.dev.package."*"]
debug-assertions = false
overflow-checks = false
codegen-units = 16

[workspace]
resolver = "2"

members = [
    "runtimes/*",
    "engine",
    "engine_ffmpeg",
    "shock2vr",
    "dark",
    "tools/asset_probe",
    "tools/dark_viewer",
    "tools/dark_explorer",
    "tools/dark_query",
    "tools/dark_vr_tool",
    "tools/debug_command",
    "tools/hitbox_analyzer",
    "tools/bench",
]

[workspace.lints.rust]
# Suppress non-local-definitions warning caused by num_derive macros (FromPrimitive/ToPrimitive)
# This is a known issue with the num_derive crate and is safe to suppress
# See: https://github.com/rust-num/num-derive/issues
non_local_definitions = "allow"

[patch.crates-io]
ffmpeg-sys-next = { path = "vendor/ffmpeg-sys-next" }
