[package]
name = "dark_explorer"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "dark_explorer"
path = "src/main.rs"

[dependencies]
engine = { path = "../../engine" }
shock2vr = { path = "../../shock2vr", default-features = false }
dark = { path = "../../dark" }
dark_viewer = { path = "../dark_viewer", default-features = false }
gl = "0.14.0"
shipyard = "0.6.2"
# Same version shock2vr uses, for reading raw archive entries directly.
zip = "0.6.6"
cgmath = "0.18.0"
# Same version shock2vr uses, to map a motion-DB actor index back to ActorType.
num-traits = "0.2.15"
clap = { version = "4.5.4", features = ["derive"] }
eframe = { version = "=0.36.1", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
# Same version the engine uses, so the workspace builds one copy.
image = { version = "0.24.3", default-features = false, features = ["png"] }
