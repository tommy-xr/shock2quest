[package]
name = "entity_inspector"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "entity_inspector"
path = "src/main.rs"

[dependencies]
dark = { path = "../../dark" }
engine = { path = "../../engine" }
clap = { version = "4.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"
regex = "1.10"
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "1.0"