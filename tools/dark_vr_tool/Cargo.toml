[package]
name = "dark_vr_tool"
version = "0.1.0"
edition = "2024"

[features]
installer = ["dep:eframe", "dep:rfd", "dep:image", "dep:sha2", "dep:tempfile"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5.4", features = ["derive", "env"] }
ratatui = "0.30"
serde_json = "1.0"
eframe = { version = "=0.36.1", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"], optional = true }
rfd = { version = "0.17.2", optional = true }
image = { version = "0.24.3", default-features = false, features = ["png"], optional = true }
sha2 = { version = "0.10", optional = true }
tempfile = { version = "3", optional = true }

[dev-dependencies]
tempfile = "3"
