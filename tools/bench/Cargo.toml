[package]
name = "bench"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "bench"
path = "src/main.rs"

[dependencies]
dark = { path = "../../dark" }
shock2vr = { path = "../../shock2vr", default-features = false }
cgmath = "0.18.0"
clap = { version = "4.5.4", features = ["derive"] }
anyhow = "1.0"
rand = "0.8.5"
serde = { version = "1.0.164", features = ["derive"] }
serde_json = "1.0.91"
