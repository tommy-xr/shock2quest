[package]
name = "shock2quest"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["lib", "cdylib"]

[package.metadata.android]
package = "com.tommybuilds.shock2quest"
build_targets = ["aarch64-linux-android"]
runtime_libs = "lib"
assets = "./../../assets"
resources = "./res"

[package.metadata.android.sdk]
min_sdk_version = 21
target_sdk_version = 26

[package.metadata.android.application]
theme = "@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen"

# Virtual path your application's icon for any mipmap level.
# If not specified, an icon will not be included in the APK.
icon = "@mipmap/icon"
# Launcher name. Without it cargo-apk falls back to the crate name ("shock2quest").
label = "Shock2Quest"

# Meta's launcher reads these to classify the app as a Quest VR title rather
# than an unrecognized 2D sideload. `eureka` is Quest 3.
[[package.metadata.android.application.meta_data]]
name = "com.oculus.supportedDevices"
value = "quest2|questpro|eureka"

[[package.metadata.android.application.meta_data]]
name = "com.samsung.android.vr.application.mode"
value = "vr_only"

[package.metadata.android.application.activity]
theme = "@android:style/Theme.Black.NoTitleBar.Fullscreen"
config_changes = "density|keyboard|keyboardHidden|navigation|orientation|screenLayout|screenSize|uiMode"
launch_mode = "singleTask"
orientation = "landscape"
resizeable_activity = false

# Loopback-only debug input server (debug_input.rs): Android denies socket()/
# bind() even on 127.0.0.1 to apps without INTERNET permission.
[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[[package.metadata.android.uses_permission]]
name = "android.permission.WRITE_EXTERNAL_STORAGE"

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_EXTERNAL_STORAGE"

[[package.metadata.android.uses_feature]]
name = "oculus.software.handtracking"
required = false

# Declares a 6DoF VR app; the launcher uses this to place it with VR titles.
[[package.metadata.android.uses_feature]]
name = "android.hardware.vr.headtracking"
required = true
version = 1

[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.MAIN"]
categories = [
    "com.oculus.intent.category.VR",
    "android.intent.category.LAUNCHER",
]

[package.metadata.android.signing.release]
path = "./develop.keystore"
keystore_password = "tommyshock"

[features]
linked = []

# This dependency will only be included when targeting Android
[target.'cfg(target_os = "android")'.dependencies]
ndk-glue = "0.6.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
cargo-apk = "0.9.7"
gl = "0.14.0"
khronos-egl = { version = "4.1.0", features = ["dynamic"] }
libloading = "0.7.3"
openxr = "0.21.1"
engine = { path = "../../engine" }
shock2vr = { path = "../../shock2vr", features = ["ffmpeg"] }
pcx = "0.2.3"
dark = { path = "../../dark" }
ndk = "0.7.0"
ndk-context = "0.1.1"
oboe = { version = "0.5", features = [ "java-interface", "shared-stdcxx" ] }
jni = "0.19.0"
ndk-sys = "0.4.0"
cgmath = "0.18.0"
libm = "0.2.5"
lazy_static = "1.4.0"
serde_json = "1.0"
tokio = { version = "1.22.0", features = ["full"] }
tracing = "0.1.37"
