[alias]
dv = "run --release -p dark_viewer --"
dq = "run --release -p dark_query --"
dx = "run --release -p dark_explorer --"
dr = "run --release -p desktop_runtime --"
dbgr = "run --release -p debug_runtime --"
dbgc = "run --release -p debug_command --"
# "bench" itself is a built-in cargo command, so the alias is "bn"
bn = "run --release -p bench --"